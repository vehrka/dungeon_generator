[project]
name = "dungeon-generator"
version = "0.1.0"
description = "Generating dungeons using FantomX11 syntax"
authors = [{ name = "Pedro-Juan Ferrer", email = "vehrka@gmail.com" }]
license = { text = "Beerware" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "igraph>=0.11",
    "matplotlib>=3.8",
    "cairocffi>=1.6",
]

[dependency-groups]
dev = [
    "ipython>=8.0",
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.black]
line-length = 120

[tool.pytest.ini_options]
pythonpath = ["."]
