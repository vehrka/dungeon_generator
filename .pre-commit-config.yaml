repos:
- repo: https://github.com/psf/black
  rev: 26.10.1
  hooks:
  - id: black
    args: ["--skip-string-normalization", "--line-length", "100"]
- repo: https://github.com/pycqa/flake8
  rev: 7.4.1
  hooks:
  - id: flake8
- repo: https://github.com/pycqa/isort
  rev: 9.0.2
  hooks:
  - id: isort
    name: isort (python)
    args: ["--profile","black"]
